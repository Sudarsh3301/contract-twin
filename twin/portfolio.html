<style>
:root {
  color-scheme: light dark;
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #5e5c56; --line: #cfccc4; --soft: #eeece7;
  --termination: #b3261e; --termination-bg: #fbe3e1;
  --prepayment: #8a2d6b; --prepayment-bg: #f6dfee;
  --consent: #8f4e00; --consent-bg: #fbe9d2;
  --notice: #1f5fa8; --notice-bg: #dde9f8;
  --deadline: #0f6e66; --deadline-bg: #d8f0ed;
  --other: #55534e; --other-bg: #e9e7e2;
  --none: #5e5c56; --none-bg: transparent;
  --blocked: #4d4b46; --blocked-bg: #e2e0da;
  --counsel: #6a3fa0; --counsel-bg: #ece3f7;
  --clear: #1b6b3a; --clear-bg: #dcf0e3; --plan: #8a5a00; --plan-bg: #fbeccd; --option: #3d5a73; --option-bg: #e1e9f0;
  --focus: #1f5fa8; --warn: #8f4e00; --ok: #0f6e66;
  --vT: #0f6e66; --vF: #5e5c56; --vU: #8f4e00; --edge: #b9b5ac; --lit: #1f5fa8;
}
:root[data-theme="light"] { color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171716; --panel: #212120; --ink: #ecebe7; --muted: #aaa7a0; --line: #4a4945; --soft: #2a2a28;
    --termination: #ff8a80; --termination-bg: #4a1f1c; --prepayment: #f19ad3; --prepayment-bg: #452438;
    --consent: #ffb866; --consent-bg: #47331a; --notice: #8fbaf0; --notice-bg: #1f3350;
    --deadline: #7fd8cd; --deadline-bg: #173d39; --other: #c4c1ba; --other-bg: #34332f; --none: #aaa7a0;
    --blocked: #c9c6bf; --blocked-bg: #33322f; --counsel: #c9a6f5; --counsel-bg: #36294a;
  --clear: #7fd8a0; --clear-bg: #17382a; --plan: #ffc766; --plan-bg: #47381a; --option: #9fc0dc; --option-bg: #26343f;
    --focus: #8fbaf0; --warn: #ffb866; --ok: #7fd8cd;
    --vT: #7fd8cd; --vF: #aaa7a0; --vU: #ffb866; --edge: #55534e; --lit: #8fbaf0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #171716; --panel: #212120; --ink: #ecebe7; --muted: #aaa7a0; --line: #4a4945; --soft: #2a2a28;
  --termination: #ff8a80; --termination-bg: #4a1f1c; --prepayment: #f19ad3; --prepayment-bg: #452438;
  --consent: #ffb866; --consent-bg: #47331a; --notice: #8fbaf0; --notice-bg: #1f3350;
  --deadline: #7fd8cd; --deadline-bg: #173d39; --other: #c4c1ba; --other-bg: #34332f; --none: #aaa7a0;
  --blocked: #c9c6bf; --blocked-bg: #33322f; --counsel: #c9a6f5; --counsel-bg: #36294a;
  --clear: #7fd8a0; --clear-bg: #17382a; --plan: #ffc766; --plan-bg: #47381a; --option: #9fc0dc; --option-bg: #26343f;
  --focus: #8fbaf0; --warn: #ffb866; --ok: #7fd8cd;
  --vT: #7fd8cd; --vF: #aaa7a0; --vU: #ffb866; --edge: #55534e; --lit: #8fbaf0;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--notice); }
header { padding: 14px 24px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
.top { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; align-items: flex-start; }
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 4px; letter-spacing: -.015em; max-width: 34ch; }
h2 { font-size: 18px; margin: 22px 0 8px; }
h3 { font-size: 16px; margin: 0 0 6px; }
h4 { font-size: 14px; }
.sub { color: var(--muted); font-size: 14px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: flex-end; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; max-width: 100%; flex-wrap: nowrap; scrollbar-width: thin; }
.seg button { font: inherit; font-size: 14px; font-weight: 600; padding: 6px 14px; border: 0; background: var(--panel); color: var(--muted); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.seg button:disabled { cursor: not-allowed; opacity: .55; }
.simnote { font-size: 13px; color: var(--muted); margin: 6px 0 0; max-width: 90ch; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; margin: 0 0 10px; }
.stats b { font-size: 16px; }
nav { display: flex; gap: 4px; margin-top: 8px; overflow-x: auto; }
nav a { padding: 8px 14px; color: var(--muted); text-decoration: none; border-bottom: 3px solid transparent; font-weight: 600; white-space: nowrap; }
nav a[aria-current="page"] { color: var(--ink); border-color: var(--ink); }
main { padding: 16px 24px 40px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; margin: 6px 0 12px; font-size: 13px; color: var(--muted); align-items: center; }
.tablewrap { overflow: auto; max-height: calc(100vh - 120px); border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
table.map { border-collapse: separate; border-spacing: 0; font-size: 13px; }
.map th, .map td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--soft); padding: 0; }
.map thead th { position: sticky; top: 0; background: var(--panel); z-index: 2; vertical-align: bottom; min-width: 150px; }
.map th.corner { left: 0; z-index: 3; min-width: 250px; text-align: left; padding: 6px 10px; color: var(--muted); font-weight: 500; }
.map tbody th { position: sticky; left: 0; background: var(--panel); z-index: 1; text-align: left; }
.hbtn { all: unset; cursor: pointer; display: block; padding: 6px 8px; width: 100%; box-sizing: border-box; }
.hbtn:hover { background: var(--soft); }
.hbtn:focus-visible, .cell:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.hbtn .nm { font-weight: 600; display: block; }
.hbtn .tt { color: var(--muted); display: block; max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 400; }
.cell { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 1px; width: 100%; min-height: 52px; padding: 4px 8px; border-left: 5px solid var(--c); background: var(--cbg); color: var(--ink); font-weight: 600; }
.cell:hover { filter: brightness(.96); }
.cell .tag { font-size: 12px; font-weight: 600; color: var(--muted); }
.cell .cz { font-size: 12px; font-weight: 600; color: var(--muted); }
.cell .cz .counsel { color: var(--counsel); }
.cell.prov { border-left-style: dashed; background: color-mix(in srgb, var(--cbg) 45%, var(--panel)); }
.cell.blk { background-image: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--blocked) 14%, transparent) 6px 8px); }
.cell.pending .tag::after { content: " · not yet reviewed"; }
.cell.none { font-weight: 400; color: var(--muted); }
.cell.absent { cursor: default; color: var(--muted); font-weight: 400; border-left-color: transparent; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 13px; font-weight: 700; border: 1px solid var(--c); color: var(--c); background: var(--cbg); white-space: nowrap; }
.c-termination { --c: var(--termination); --cbg: var(--termination-bg); }
.c-prepayment { --c: var(--prepayment); --cbg: var(--prepayment-bg); }
.c-consent { --c: var(--consent); --cbg: var(--consent-bg); }
.c-notice { --c: var(--notice); --cbg: var(--notice-bg); }
.c-deadline { --c: var(--deadline); --cbg: var(--deadline-bg); }
.c-other { --c: var(--other); --cbg: var(--other-bg); }
.c-none { --c: var(--none); --cbg: var(--none-bg); }
.c-blocked { --c: var(--blocked); --cbg: var(--blocked-bg); }
.c-counsel { --c: var(--counsel); --cbg: var(--counsel-bg); }
.c-clear { --c: var(--clear); --cbg: var(--clear-bg); }
.c-plan { --c: var(--plan); --cbg: var(--plan-bg); }
.c-option { --c: var(--option); --cbg: var(--option-bg); }
.tools { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
select { font: inherit; font-size: 14px; padding: 3px 6px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; max-width: 100%; }
input[type=checkbox], input[type=range] { accent-color: var(--focus); }
button.plain { font: inherit; font-size: 14px; padding: 4px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; cursor: pointer; }
button.plain:hover { background: var(--soft); }
.warn { color: var(--warn); }
.ok { color: var(--ok); }
.note { color: var(--muted); font-size: 13px; }
.prose { max-width: 72ch; }
code { font-size: 13px; word-break: break-word; }
blockquote { margin: 6px 0; padding: 8px 12px; border-left: 3px solid var(--line); background: var(--soft); border-radius: 0 4px 4px 0; font-family: Georgia, "Times New Roman", serif; font-size: 15px; max-width: 72ch; }
blockquote[dir="rtl"], blockquote[dir="auto"] { unicode-bidi: plaintext; }
blockquote[dir="rtl"] { border-left: 0; border-right: 3px solid var(--line); border-radius: 4px 0 0 4px; font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", serif; font-size: 17px; line-height: 1.8; }
blockquote .sid { color: var(--muted); font-family: system-ui, sans-serif; font-size: 13px; }
blockquote mark, .rg-pane mark { background: color-mix(in srgb, var(--lit) 30%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }
details > summary { cursor: pointer; color: var(--muted); font-size: 14px; margin-top: 6px; }
table.counts { border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); font-size: 13px; max-width: 100%; display: block; overflow-x: auto; }
.counts th, .counts td { padding: 4px 10px; border-bottom: 1px solid var(--soft); text-align: right; }
.counts th:first-child, .counts td:first-child { text-align: left; }
table.atoms { width: 100%; border-collapse: collapse; font-size: 13px; margin: 6px 0; display: block; overflow-x: auto; }
.atoms th, .atoms td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--soft); vertical-align: top; }
.atoms th { color: var(--muted); font-weight: 500; }
.big { font-size: 15px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 10px 0 16px; max-width: 100ch; }
.summary { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 2px; }
.summary li { display: grid; grid-template-columns: 230px 1fr; gap: 12px; padding: 5px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; font-size: 13px; }

/* ---------- overview ---------- */
.top2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; margin: 0 0 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card h2 { margin: 0 0 8px; font-size: 16px; }
.scale { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sc { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); min-width: 0; }
.sc .n { font-weight: 700; font-size: 15px; }
.sc .n small { font-weight: 400; font-size: 13px; color: var(--muted); }
.sc .row { display: flex; justify-content: space-between; gap: 6px; font-size: 14px; margin-top: 4px; }
.sc .row b { font-size: 16px; }
.sc .twin b { color: var(--clear); }
.sc .tag { font-size: 12px; font-weight: 700; color: var(--plan); }
.scnote { margin: 10px 0 0; font-size: 14px; }
.abar { display: flex; height: 30px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); margin: 10px 0 6px; }
.abar span { display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--ink); background: var(--cbg); min-width: 2px; overflow: hidden; }
.abar span + span { border-left: 2px solid var(--panel); }
.alegend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; }
.alegend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--c); margin-right: 5px; vertical-align: -1px; }
.delta { font-weight: 700; font-size: 15px; color: var(--clear); }
.acard .seg { margin: 0 0 4px; }
.proof { margin: 0 0 14px; font-size: 15px; font-weight: 600; }
.panels { display: grid; gap: 16px; margin-top: 28px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px 16px; }
.panel h2 { margin: 0 0 4px; font-size: 18px; }
.stakebar { position: relative; height: 18px; margin: 18px 6px 4px; background: var(--soft); border: 1px solid var(--line); border-radius: 9px; }
.stakebar i { position: absolute; top: -6px; width: 6px; height: 28px; margin-left: -3px; border-radius: 3px; background: var(--c); }
.axis { display: flex; justify-content: space-between; margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.marklist { list-style: none; margin: 6px 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 10px; }
.marklist li { display: flex; align-items: center; gap: 6px; font-size: 15px; }
.marklist button, .rbtns button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.marklist button { border-left: 5px solid var(--c); }
.marklist button:hover, .rbtns button:hover { background: var(--soft); }
.rbtns { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.rbtns button { font-weight: 600; padding: 6px 14px; }
.rbtns button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.revs { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; margin: 6px 0; }
.rev { border: 1px solid var(--line); border-left: 5px solid var(--c); background: var(--cbg); border-radius: 6px; padding: 6px 8px; font-size: 14px; min-width: 0; }
.rev b { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }
.cases { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 8px; }
.case h3 { font-size: 16px; margin: 0 0 4px; }
.run { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 6px 0; border-top: 1px solid var(--soft); font-size: 14px; }
.run .why { grid-column: 2; color: var(--muted); font-size: 13px; margin: 0; display: block; }
.twinbox { border: 1px solid var(--clear); border-left: 5px solid var(--clear); border-radius: 6px; padding: 8px 12px; margin: 8px 0; background: var(--clear-bg); }
.langnote { font-size: 14px; color: var(--muted); margin: 4px 0; }
.rvnav { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 10px; font-size: 14px; }
.events { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
@media (min-width: 700px) { .events { flex-wrap: wrap; overflow-x: visible; } }
@media (max-width: 699px) { .events.more { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); } }
.events button { font: inherit; font-size: 14px; font-weight: 600; flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 18px; padding: 6px 14px; cursor: pointer; }
.events button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.sentence { font-size: 18px; line-height: 1.5; max-width: 72ch; margin: 12px 0 16px; }
.ov { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 560px); grid-template-areas: "a r" "c r"; grid-template-rows: auto 1fr; gap: 0 28px; align-items: start; }
#actions { grid-area: a; } .ripbox { grid-area: r; } #cants { grid-area: c; }
.ov h3.grp { display: flex; align-items: center; gap: 8px; margin: 18px 0 6px; font-size: 16px; }
.ov h3.grp:first-child { margin-top: 0; }
.acts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.act { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 8px; }
.act .what { grid-column: 2; font-size: 16px; }
.act .meta { grid-column: 2; font-size: 13px; color: var(--muted); }
.act .st { grid-row: 1 / span 2; align-self: start; }
.act button { grid-row: 1 / span 2; grid-column: 3; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 1px 8px; border-radius: 12px; border: 1px solid var(--c); color: var(--c); background: var(--cbg); white-space: nowrap; }
.badge.plan { border-style: dashed; }
.lang { font-size: 12px; font-weight: 700; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); white-space: nowrap; }
.why { display: grid; gap: 10px; margin-bottom: 14px; }
.why h4 { margin: 0 0 4px; font-size: 15px; }
.why p { margin: 0 0 4px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.pills button:hover { background: var(--soft); }
.ripbox { position: sticky; top: 8px; }
svg.ripple { width: 100%; height: auto; max-width: 560px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: block; }
.ripple text { font-family: system-ui, sans-serif; font-size: 12px; fill: var(--ink); }
.ripple .ct { cursor: pointer; }
.ripple .ct:focus { outline: none; }
.ripple .ct:focus .shape, .ripple .ct:hover .shape { stroke-width: 4; }
.ripple .ct .shape { fill: var(--cbg); stroke: var(--c); stroke-width: 2.4; transition: fill .3s, stroke .3s; }
.ripple .ct.cant .shape { stroke-dasharray: 5 3; }
.ripple .ct text.mk { font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.ripple .ct text.lb { font-size: 12px; }
.ripple .spoke { stroke: var(--line); stroke-width: 1; }
.ripple .ring { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 3 5; }
.ripple .ringbtn { cursor: pointer; }
.ripple .openarc { fill: none; stroke: var(--blocked); stroke-width: 10; stroke-dasharray: 6 4; opacity: .75; }
.ripple .ringbtn rect { fill: var(--panel); stroke: var(--line); }
.ripple .ringbtn:focus { outline: none; }
.ripple .ringbtn:focus rect { stroke: var(--focus); stroke-width: 2.5; }
.ripple .dotn { fill: var(--soft); stroke: var(--muted); stroke-width: 1.4; cursor: pointer; }
.ripple .centre circle { fill: var(--soft); stroke: var(--line); }
.ripple .centre text { fill: var(--ink); font-weight: 700; text-anchor: middle; }
.ripple .wave { fill: none; stroke: var(--lit); stroke-width: 2; opacity: 0; }
.ripple .wave.go { animation: wave 1.4s ease-out; }
@keyframes wave { from { r: 60; opacity: .9; } to { r: 270; opacity: 0; } }
.key { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.key span { display: inline-flex; align-items: center; gap: 5px; }
.marks { display: grid; gap: 10px; }
.marks .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.marks button:not(.plain) { all: unset; cursor: pointer; line-height: 0; border-radius: 6px; }
.marks button:focus-visible { outline: 2px solid var(--focus); }
.marks svg .shape { fill: var(--cbg); stroke: var(--c); stroke-width: 2.4; }
.marks svg.cant .shape { stroke-dasharray: 5 3; }
.marks svg text { font: 700 15px system-ui, sans-serif; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }

.lead { font-size: 17px; margin: 0 0 12px; max-width: 70ch; }
.proofs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0 0 8px; }
.proofs > div { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 8px; padding: 8px 12px; font-size: 14px; line-height: 1.4; }
.proofs b { display: block; font-size: 15px; margin-bottom: 2px; }
.proofs .sm { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.honest { font-size: 14px; color: var(--muted); margin: 0 0 12px; max-width: 110ch; }
.sched h2, .oi h2 { margin: 0 0 6px; font-size: 20px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.sched h2 button { font-size: 13px; font-weight: 400; }
.oi { margin-top: 22px; }
.oi .line { margin: 0 0 8px; font-weight: 600; }
.oi h3 { margin: 14px 0 2px; font-size: 16px; display: flex; align-items: center; gap: 8px; }

<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const TEMPLATE = {coc: "change of control", assign: "assignment", term: "term and renewal"};
const STATUS = {firm: "Answered", provisional: "Worst case planned", blocked: "Open item"};
const WHY_LABEL = {missing_document: "Document missing", missing_fact: "Fact missing", check_extraction: "Check the extraction",
  legal_judgement: "A legal call", versions: "Language versions disagree", unclear: "Not yet clear"};

  missing_fact: "The answer depends on a business fact, not on the text. Give it as an input.",
  check_extraction: "The model was unsure what the clause says. Someone should check the quote.",
  legal_judgement: "The clause needs a legal reading. It is a question for counsel.",
  versions: "The English and Arabic versions give different answers. Unknown is not false, so nothing is assumed.",
  unclear: "The result is open for a reason that is not named."};

const OPEN = {document: ["Needs a document we don’t have", "A definition or a term lives in another agreement. With that document the rules can answer.", "Missing"],
  counsel: ["Question for counsel", "The clause needs a legal reading. Nothing is guessed; where there is a worst case it is shown as a note.", "Question"],
  check: ["Check one fact", "The model was unsure what the clause says. Someone checks the quote and confirms one fact.", "Check"],
  unreviewed: ["Not reviewed in this demo", "The model was unsure and this agreement has no hand labels, so the simulated reviewer skipped it.", "Not checked"]};
const OPEN_ORDER = ["document", "counsel", "check", "unreviewed"];
const OPEN_OF = {missing_document: "document", legal_judgement: "counsel"};
const GROUPS = ["consent", "notify", "they", "auto", "prepay", "other", "we"];
const GCLS = {auto: "termination", they: "termination", prepay: "prepayment", consent: "consent", notify: "notice", other: "other", we: "option"};
const STATUS_CLS = {firm: "clear", provisional: "plan", blocked: "blocked"};
const DEALS = D.scenarios.filter(s => s.templates.join() !== "term").sort((a, z) => (z.events[0].event === "ipo") - (a.events[0].event === "ipo"));      // IPO first; the clock is not a deal
const KIND_WORD = {service_limitation: "service limitation", deadline: "deadline", option_deadline: "option deadline", earliest_exit: "earliest exit",
  expired: "already expired", expiry: "expiry", renewed: "renewal"};
const SC = Object.fromEntries(D.scenarios.map(s => [s.id, s]));
const AG = D.agreements, AG_OF = {};
for (const [a, v] of Object.entries(AG)) v.versions.forEach(k => AG_OF[k] = a);
const keys = Object.keys(D.contracts), agKeys = Object.keys(AG);
const wj = s => String(s).replace(/[A-Za-z][A-Za-z0-9]*(?:_[A-Za-z0-9]+)+/g, w => D.words[w] || w.replace(/_/g, " "));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const lang = k => D.contracts[k].lang;
const nm = k => AG[AG_OF[k]].name;
const hasPair = ak => AG[ak].versions.length > 1;
const langMark = (ak, a) => hasPair(ak) ? `<span class="lang"${a && a.note ? ` title="${esc(a.note)}"` : ""}>EN · AR</span>` : lang(AG[ak].versions[0]) === "ar" ? '<span class="lang">AR</span>' : "";
const verName = k => lang(k) === "ar" ? "Arabic version" : "English version";
const who = (h, k) => ({us: `our party (${D.contracts[k].party})`, them: "counterparty", either: "either party", both: "both parties"}[h] || "-");
const sevName = n => ({6: "they may terminate or demand prepayment", 5: "their consent is needed", 4: "we must notify", 3: "a service limitation", 2: "a deadline", 1: "another effect", 0: "nothing"})[n];
const sevClass = n => n >= 6 ? "termination" : n === 5 ? "consent" : n === 4 ? "notice" : n === 2 ? "deadline" : n ? "other" : "none";
const kindClass = x => x.status !== "TRIGGERED" ? "none" :
  ({termination_right: "termination", automatic_termination: "termination", prepayment: "prepayment", consent: "consent", notice: "notice"}[x.kind] || "other");
const plural = (n, one, many) => n === 1 ? one : many;
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fmtDate = s => { const [y, m, d] = s.split("-").map(Number); return `${d} ${MONTHS[m - 1]} ${y}`; };
const fmtMoney = v => `$${+(v / 1e6).toFixed(1)}M`;
const dayDiff = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
let stateName = D.states.review ? "review" : "compiled", view = "ripple", rowOrder = [], colOrder = [], sortNote = "", backTo = "ripple", rippleSc = D.default_event, qEv = "", showNone = false, rippleDone = false;
const S = () => D.states[stateName];
const PHONE = window.matchMedia("(max-width: 699px)");

// ---------------- events, in page words ----------------
function chipLabel(sc, short) {
  const e = SC[sc].events[0];
  return e.event === "share_sale" ? (e.buyer_is_competitor ? `Competitor buys ${e.buyer_pct}%` : `Sell ${e.buyer_pct}%${short ? "" : " + new management"}`) :
    e.event === "ipo" ? `IPO ${fmtMoney(e.gross_proceeds_usd)}${short ? "" : ` · sponsors keep ${e.sponsor_pct_after}%`}` :
    e.event === "holding_insertion" ? `New parent (${e.mechanism === "merger" ? "merger" : "share swap"})` : `+${dayDiff(D.as_of, e.to)} days`;
}
function eventPhrase(sc) {
  const e = SC[sc].events[0];
  return e.event === "share_sale" ? (e.buyer_is_competitor ? `a competitor buys ${e.buyer_pct}% of us` : `${e.buyer_pct}% of us is sold to one buyer and management changes`) :
    e.event === "ipo" ? `we list in an IPO that raises ${fmtMoney(e.gross_proceeds_usd)} and the sponsors keep ${e.sponsor_pct_after}%` :
    e.event === "holding_insertion" ? `a new holding company is put above us by ${e.mechanism === "merger" ? "a merger" : "a share exchange"}` :
    `the date moves forward to ${fmtDate(e.to)}`;
}
// "termination right (counterparty); notice (us) by 2026-11-05" -> "they may terminate; we must notify by 5 Nov 2026"
const KIND_PL = {"termination right": ["we may terminate", "they may terminate"], "automatic termination": ["ends automatically", "ends automatically"],
  prepayment: ["we may demand prepayment", "they may demand prepayment"], consent: ["we give consent", "their consent is needed"],
  notice: ["we must notify", "they must notify us"], "service limitation": ["service is limited", "service is limited"]};
function plainLabel(l) {
  return String(l).split("; ").map(p => {
    if (p === "no reaction") return "no reaction";
    if (p === "blocked") return "open item";
    const m = p.match(/^(.*?)(?: \((us|counterparty)\))?(?: by (\d{4}-\d\d-\d\d))?$/);
    const t = KIND_PL[m[1]] ? KIND_PL[m[1]][m[2] === "us" ? 0 : 1] : m[1];
    return t + (m[3] ? ` by ${fmtDate(m[3])}` : "");
  }).join("; ");
}
function compose(effects, name) {
  let first = true;
  const s = effects.map(e => {
    const t = e.text.replace("{S}", first ? name : "they").replace("{O}", first ? name : "them") + (e.due ? (e.by ? " by " : " on ") + fmtDate(e.due) : "");
    first = false;
    return t;
  }).join("; ");
  return s.startsWith(name) ? s : s.charAt(0).toUpperCase() + s.slice(1);
}
const clauseWord = ref => ref ? "§" + ref : "";
const itemsOf = (n, one, many) => `${n} ${plural(n, one, many)}`;
function openTail(b) {
  const o = b.open_by, parts = [];
  if (o.document.length) parts.push(`${o.document.length} ${plural(o.document.length, "needs", "need")} a document we don’t have`);
  if (o.counsel.length) parts.push(`${itemsOf(o.counsel.length, "question", "questions")} for counsel`);
  if (o.check.length) parts.push(`${itemsOf(o.check.length, "fact", "facts")} to check`);
  if (o.unreviewed.length) parts.push(`${o.unreviewed.length} not reviewed in this demo`);
  return `${itemsOf(b.cant, "point", "points")} flagged for review`;
}
function sentence(sc) {
  const b = S().brief[sc], g = b.groups, parts = [];
  if (g.auto) parts.push(g.auto === 1 ? "1 ends automatically" : `${g.auto} end automatically`);
  if (g.they) parts.push(g.they === 1 ? "1 counterparty may terminate" : `${g.they} counterparties may terminate`);
  if (g.prepay) parts.push(`${g.prepay} may demand prepayment`);
  if (g.consent) parts.push(g.consent === 1 ? "1 needs their consent" : `${g.consent} need their consent`);
  if (g.notify) parts.push(`we must notify ${g.notify}`);
  if (g.other) parts.push(`${g.other} ${plural(g.other, "has", "have")} another effect (${b.other_kinds.map(k => KIND_WORD[k] || k).join(", ")})`);
  const nd = b.notify_due ? `we must give notice by ${fmtDate(b.notify_due)}` : "";
  const wc = b.worst_counsel ? ` (${b.worst_counsel} for counsel to confirm)` : "";
  let s = `If ${esc(eventPhrase(sc))}: ` + (b.react ? `<b>${b.react} of ${b.agreements} agreements</b> react${wc} — ${esc(parts.join(", "))}.` : `<b>no agreement</b> is certain to react against us.`);
  if (b.options) s += ` We hold a right to terminate ${b.options} ${plural(b.options, "agreement", "agreements")}.`;

// ---------------- text and quotes ----------------
function fmt(v) {
  if (v === null || v === undefined) return "<i>unknown</i>";
  if (Array.isArray(v) && v.length && typeof v[0] === "object")
    return v.map(e => esc(`${e.effect} / ${e.effect_holder || "?"}` + (e.notice ? ` / notice ${e.notice.join(" ")}` : "") + (e.unless_consented ? " / unless consented" : ""))).join("<br>");
  return esc(JSON.stringify(v));
}
function valuePlain(v) {
  if (v === null || v === undefined) return "not stated";
  if (v === true) return "Yes";
  if (v === false) return "No";
  if (Array.isArray(v) && v.length && typeof v[0] === "object") return v.map(e => `${String(e.effect).replace(/_/g, " ")} (${e.effect_holder || "?"})`).join("; ");
  if (Array.isArray(v)) return v.map(x => String(x).replace(/_/g, " ")).join(", ") || "none";
  if (typeof v === "object") return JSON.stringify(v);

}
function quotes(k, sids, toks) {
  const ar = lang(k) === "ar";

    || '<p class="note">No sentence is cited.</p>';
}
function quotesHi(k, r) {

  return r.sids.map(sid => quotes(k, [sid], Object.keys(r.cite).filter(a => r.cite[a].includes(sid) && r.atoms.includes(a)).flatMap(a => tokens(val(a))))).join("")
    || '<p class="note">No sentence is cited for this answer.</p>';
}
function atomRows(k, t, atoms, pend) {
  return `<table class="atoms"><tr><th>fact</th><th>value</th><th>reading status</th><th>agreement</th><th>review</th></tr>` +
    atoms.map(a => {
      const i = S().atominfo[`${k}|${t}|${a}`] || {};
      const agree = D.atoms === "gold" ? "gold" : `${i.agree}/3 runs, support ${i.support ? "passed" : "not passed"}`;
      const rv = i.reviewed ? '<span class="ok">reviewed</span>' : i.unsure ? '<span class="warn">answer needed (the model is unsure)</span>' :
        pend && pend.includes(a) ? '<span class="warn">confirm</span>' : "-";
      return `<tr><td><code>${esc(a)}</code></td><td><code>${fmt(i.value)}</code>${i.suspicious ? `<div class="warn">⚠ ${esc(i.suspicious)}</div>` : ""}</td>` +
        `<td>${esc(i.status || "")}</td><td>${agree}</td><td>${rv}</td></tr>`;
    }).join("") + "</table>";
}

function reactionLines(xs, k) {

function answerOf(id, ak, k) {

    `<ul class="branches">${r.branches.map(b => `<li><span class="chip c-${sevClass(b.sev)}">${esc(plainLabel(b.label))}</span> — ${esc(b.when)}</li>`).join("")}</ul>`);

// ---------------- to resolve ----------------
function answerOpts(allowed) {
  if (/^true or false/.test(allowed) || /^"yes" or "no"/.test(allowed)) return ["Yes", "No", "Not stated"];
  const m = allowed.match(/^"[a-z_]+"( or "[a-z_]+")+/);
  return m ? m[0].split(" or ").map(x => wj(x.replace(/"/g, ""))).concat("Not stated") : null;

const plainAllowed = a => wj(a.replace(/^any list drawn from: /, "choose any that apply: ").replace(/^a list of effects: /, "choose the effects: "));
const plainImpact = s => s.replace(/become firm/g, "become answered").replace(/none of (\d+) become firm/, "none of $1 becomes answered");
const askOf = (t, a) => D.ask[`${t}|${a}`] || wj(a);
function counselItems(sc) {
  const out = [];

    if (sc && s.id !== sc) continue;
    for (const ak of agKeys) {
      const a = S().acells[s.id][ak];
      if (!a || !a.causes.includes("legal_judgement")) continue;
      const rs = a.versions && Object.keys(a.versions).flatMap(k => ((S().rows[s.id] || {})[k] || []).filter(r => r.causes.includes("legal_judgement")).map(r => ({k, r})));
      const first = rs[0];
      out.push({sc: s.id, ak, k: first ? first.k : AG[ak].versions[0], templates: [...new Set(rs.map(x => TEMPLATE[x.r.template]))],
        sev: Math.max(0, ...rs.map(x => x.r.worst_sev || 0)), text: a.item && a.item.what && a.item.kind === "counsel" ? a.item.what : (a.effects.length ? "Worst case: " + compose(a.effects, AG[ak].name) + "." : (first ? first.r.missing : ""))});
    }
  }
  return out.sort((x, z) => z.sev - x.sev || AG[x.ak].name.localeCompare(AG[z.ak].name));
}

const STOP = new Set(["us", "them", "gt", "gte", "none", "true", "false", "of", "the", "and", "or", "an", "to", "in", "no", "yes", "not"]);
// Marks whole words and phrases only ("right" is not marked inside "rights"; "60 days" is one mark).

  if (none.length) h += `<div class="row"><button class="plain" data-none aria-expanded="${showNone}" style="line-height:1.5">+${none.length} no reaction</button>` +
    (showNone ? none.map(ak => `<button data-ak="${esc(ak)}" aria-label="${esc(AG[ak].name)}: no reaction">${markSvg({cls: "none", shape: "clear"})}</button>`).join("") : "") + `</div>`;
  return h + "</div>";
}
function keyHtml(sc) {
  const b = S().brief[sc], chips = GROUPS.filter(x => x === "we" ? b.options : b.groups[x]).map(x =>
    `<span class="chip c-${GCLS[x]}">${esc(D.group_label[x])} ${x === "we" ? b.options : b.groups[x]}</span>`);
  if (b.cant) chips.push(`<span class="chip c-blocked">To review ${b.cant}</span>`);
  return (PHONE.matches ? "" : `<div class="key">${chips.join("")}</div>`);
}
// ---------------- how it decides: three real clauses ----------------
function excerpt(text, toks, n = 280) {
  if (text.length <= n) return text;
  const low = text.toLowerCase(), hits = toks.map(t => low.indexOf(String(t).toLowerCase())).filter(i => i >= 0).sort((a, z) => a - z);
  const a = Math.max(0, Math.min((hits[0] || 0) - 90, text.length - n)), cutText = text.slice(a, a + n).replace(a ? /^\S*\s/ : /^$/, "");
  return (a ? "… " : "") + cutText.trim() + (a + n < text.length ? " …" : "");
}
const cap1 = t => t.charAt(0).toUpperCase() + t.slice(1);
function decideHtml() {
  return `<section class="panel" id="p-decide"><h2>How it decides</h2><p class="note prose">Three real clauses. The rules read the clause, test the numbers, check the exceptions and state the effect. When a word needs a judgement, they stop and ask counsel.</p><div class="strip3">` +
    D.decide.map(c => {
      const k = AG[c.ak].versions[0], rows = (S().rows[c.sc] || {})[k] || [], a = S().acells[c.sc][c.ak];
      const r = rows.find(x => x.status !== "firm" || x.reactions.some(y => y.status === "TRIGGERED")) || rows[0];
      if (!r) return "";
      const sid = (r.sids[0] ?? Object.values(r.cite)[0]?.[0]), val = at => (S().atominfo[`${k}|${r.template}|${at}`] || {}).value;
      const toks = Object.keys(r.cite).filter(at => r.cite[at].includes(sid)).flatMap(at => tokens(val(at)));
      const kinds = ks => r.why.filter(w => ks.includes(w[0])).map(w => w[1]).join(" ");
      const last = kinds(["effect", "result"]) + (a && a.counsel_wc ? ` Worst case: ${compose(a.effects, AG[c.ak].name)}.` : "");
      return `<div class="dcard"><h3><bdi>${esc(AG[c.ak].name)}</bdi> · ${esc(chipLabel(c.sc, true))}</h3><p class="note">${esc(c.title)}</p>` +
        (sid !== undefined ? `<blockquote dir="auto">${highlight(excerpt(D.sentences[k][sid], toks), toks)}</blockquote>` : "") +
        `<ol><li>${esc(cap1(eventPhrase(c.sc)) + ".")}</li><li>${esc(kinds(["test", "exception"]))}</li><li>${esc(last)}</li></ol>` +
        `<button class="plain go" data-why="${esc(c.sc + "|" + k)}" aria-label="Open ${esc(AG[c.ak].name)}">Open</button></div>`;
    }).join("") + `</div></section>`;
}
// ---------------- print: the schedule for the chosen event on one page ----------------
function printHtml(sc) {
  const list = Object.entries(S().acells[sc]).filter(([, a]) => a.group);
  list.sort((x, z) => GROUPS.indexOf(x[1].group) - GROUPS.indexOf(z[1].group) || earliest(x[1]).localeCompare(earliest(z[1])) || byName(x, z));
  const b = S().brief[sc];
  let h = `<h1>Consent and notice schedule</h1><p class="sub">${esc(cap1(eventPhrase(sc)))} · as of ${esc(fmtDate(D.as_of))} · ${esc(S().label)} · proof of concept, not legal advice</p>`;
  for (const g of GROUPS) {
    const items = list.filter(([, a]) => a.group === g);
    if (items.length) h += `<h2>${esc(g === "we" ? "Options for us: we may terminate" : D.group_label[g])} (${items.length})</h2><ul>` +
      items.map(([ak, a]) => `<li>${esc(compose(a.effects, AG[ak].name))}${a.counsel_wc ? " (counsel to confirm)" : a.status !== "firm" ? " (worst case)" : ""}${a.effects[0].ref ? " — " + esc(clauseWord(a.effects[0].ref)) : ""}</li>`).join("") + `</ul>`;
  }
  if (!list.length) h += `<p>No agreement is certain to react against us under this event.</p>`;
  h += `<h2>Points to review (${b.cant})</h2>`;
  for (const k of OPEN_ORDER) {
    const ak = b.open_by[k];
    if (ak.length) h += `<h2 style="font-size:11pt">${esc(OPEN[k][0])} (${ak.length})</h2><ul>` + ak.map(x => { const a = S().acells[sc][x];
      return `<li>${esc(AG[x].name)}${a.item.what ? ": " + esc(a.item.what) : ""}${a.counsel_wc ? " (worst case: " + esc(compose(a.effects, AG[x].name)) + ")" : ""}</li>`; }).join("") + `</ul>`;
  }
  return h;
}
function rippleHtml(animate) {
  const sc = rippleSc;
  return `${PHONE.matches ? "" : proofsHtml()}<div class="events" role="group" aria-label="Event">` + DEALS.map(s =>
      `<button data-rip="${s.id}" aria-pressed="${s.id === sc}" title="${esc(s.name)}">${esc(chipLabel(s.id))}</button>`).join("") + `</div>` +
    `<p class="sentence">${sentence(sc)}</p><p class="note">Where a clause is unclear, it plans for the stricter reading and flags the point for counsel.</p>${PHONE.matches ? proofsHtml() : ""}<div class="ov"><div id="actions" class="sched"><h2>Consent and notice schedule <button class="plain" data-print>Print this schedule</button></h2>${actionsHtml(sc)}</div>` +
    `<div class="ripbox">${PHONE.matches ? marksHtml(sc) : rippleSvg(sc, animate)}${keyHtml(sc)}<p class="note">Select an agreement to see why.</p></div><div id="cants">${openHtml(sc)}</div></div>` +
    `<div class="panels">${panelReading()}${decideHtml()}${panelLLM()}${panelStake()}${effortHtml()}${testedHtml()}</div>`;
}
function bindWhy(v) { v.querySelectorAll("[data-why]").forEach(b => b.onclick = () => go("ev=" + b.dataset.why, stateName)); }
function renderRipple(animate) {
  const v = document.getElementById("view-ripple");
  v.innerHTML = rippleHtml(animate);
  document.getElementById("printsheet").innerHTML = printHtml(rippleSc);
  v.querySelectorAll("[data-rip]").forEach(b => b.onclick = () => go("ripple=" + b.dataset.rip, stateName));
  v.querySelectorAll("[data-state]").forEach(b => b.onclick = () => go("ripple=" + rippleSc, b.dataset.state));
  v.querySelectorAll("[data-print]").forEach(b => b.onclick = () => window.print());
  v.querySelectorAll("[data-read]").forEach(b => b.onclick = () => { readPick = +b.dataset.read; renderRipple(false);
    document.querySelector(`#view-ripple [data-read="${readPick}"]`).focus(); });
  bindWhy(v);
  v.querySelectorAll("[data-ak]").forEach(g => {
    const open = () => go("ev=" + rippleSc + "|" + g.dataset.ak, stateName);
    g.onclick = open; g.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } };
  });
  v.querySelectorAll("g[data-jump]").forEach(g => g.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); g.dispatchEvent(new MouseEvent("click", {bubbles: true})); } });
  v.querySelectorAll("[data-none]").forEach(g => {
    const flip = () => { showNone = !showNone; renderRipple(false); const again = document.querySelector("#view-ripple [data-none]"); if (again) again.focus(); };
    g.onclick = flip; g.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } };
  });
  const row = v.querySelector(".events"), fade = () => row.classList.toggle("more", row.scrollWidth - row.clientWidth - row.scrollLeft > 4);
  fade(); row.addEventListener("scroll", fade);
}
// The clock is not a deal: its answers live under For reviewers.
function renderClock() {
  const v = document.getElementById("rv-clock"), sc = "clock_90";
  v.innerHTML = `<h2>+90 days (dates, not a deal)</h2><p class="sentence">${sentence(sc).replace(/data-jump="openitems"/, 'data-jump="openitems-clock"')}</p><div class="prose">${actionsHtml(sc)}</div>${openHtml(sc, "openitems-clock")}`;
  bindWhy(v);
}
// Scroll only the chip row (phones), never the page, so the page still opens at the top.
const centreChip = () => { const on = document.querySelector("#view-ripple .events [aria-pressed=true]"); if (!on) return;
  const row = on.parentElement; row.scrollLeft += on.getBoundingClientRect().left - row.getBoundingClientRect().left - (row.clientWidth - on.offsetWidth) / 2; };
PHONE.addEventListener("change", () => { if (!document.getElementById("view-ripple").hidden) renderRipple(false); });

// ---------------- routing: #<view>[@compiled] ----------------
const sfx = () => stateName === "compiled" && D.states.review ? "@compiled" : "";
function go(v, st) { location.hash = v + (st === "compiled" && D.states.review ? "@compiled" : ""); }
function route() {
  let hsh = decodeURIComponent(location.hash.slice(1)) || "ripple";
  const want = hsh.endsWith("@compiled") || !D.states.review ? "compiled" : "review";
  hsh = hsh.replace(/@(review|compiled)$/, "");
  const changed = want !== stateName;
  if (changed) { stateName = want; rippleDone = false; renderTop(); renderMap(); renderQueue(); renderClock(); }
  const ripple = hsh.startsWith("ripple");
  const seen = hsh.startsWith("ev=") ? backTo : ripple ? "ripple" : hsh;
  if (!hsh.startsWith("ev=")) backTo = ripple ? "ripple=" + rippleSc : hsh;
  if (ripple) {
    const want2 = hsh.split("=")[1] || rippleSc;
    if (DEALS.some(s => s.id === want2) && want2 !== rippleSc) { rippleSc = want2; rippleDone = false; if (!changed) renderQueue(); }
    backTo = "ripple=" + rippleSc;
  }
  const tab = seen.startsWith("ripple") ? "ripple" : "reviewers";
  if (tab === "ripple" && !rippleDone) { renderRipple(true); rippleDone = true; }
  for (const t of ["ripple", "reviewers"]) {
    document.getElementById("view-" + t).hidden = t !== tab;
    const a = document.getElementById("nav-" + t);
    a.href = "#" + t + sfx();
    if (t === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  }
  if (tab === "ripple") centreChip();
  if (!hsh.startsWith("ev=") && (hsh === "queue" || hsh === "map")) document.getElementById(hsh === "queue" ? "rv-queue" : "rv-map").scrollIntoView();
  view = seen;
  if (hsh.startsWith("ev=")) {
    const i = hsh.indexOf("|"), id = hsh.slice(3, i), k = hsh.slice(i + 1);
    if (SC[id] && D.contracts[k]) { view = hsh; return renderEvidence(id, k); }
  }
  GV.forEach(stopPlay);
  document.getElementById("ev").hidden = true;
}
document.getElementById("meta").innerHTML = `As of ${esc(fmtDate(D.as_of))} · <a href="results.html">How we tested</a>`;
document.addEventListener("click", e => {          // links that jump to a section of the page, also those drawn later
  const a = e.target.closest("[data-jump]"), t = a && document.getElementById(a.dataset.jump);
  if (t) { e.preventDefault(); if (t.tagName === "DETAILS") t.open = true; t.scrollIntoView(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !document.getElementById("ev").hidden) go(backTo, stateName); });
defaultOrder(); renderTheme(); renderTop(); renderMap(); renderQueue(); renderClock();
window.addEventListener("hashchange", route); route();
</script>
